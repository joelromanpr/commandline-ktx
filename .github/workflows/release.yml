name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  verify:
    name: verify tag and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify release tag and library version
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          tagged_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git merge-base --is-ancestor "$tagged_commit" origin/main
          tag_version="${GITHUB_REF_NAME#v}"
          [[ "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          for project in library mcp-bridge; do
            project_version="$(./gradlew -q ":$project:properties" | sed -n 's/^version: //p')"
            [[ "$project_version" == "$tag_version" ]]
          done
      - name: Check formatting, build, and test
        run: ./gradlew spotlessCheck build

  publish:
    name: publish to Maven Central
    needs: verify
    runs-on: ubuntu-latest
    environment: commandline-ktx
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

  github-release:
    name: create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out tagged release notes
        uses: actions/checkout@v4
      - name: Confirm both artifacts are available on Maven Central
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 80); do
            missing=""
            for artifact in commandline-ktx commandline-ktx-mcp-bridge; do
              for extension in pom jar; do
                url="https://repo.maven.apache.org/maven2/io/github/joelromanpr/$artifact/$version/$artifact-$version.$extension"
                if ! curl --fail --silent --location --max-time 15 --output /dev/null "$url"; then
                  missing="$missing $artifact.$extension"
                fi
              done
            done
            if [[ -z "$missing" ]]; then
              echo "Both artifacts are available on Maven Central at $version"
              break
            fi
            if [[ "$attempt" -eq 80 ]]; then
              echo "Timed out waiting for:$missing" >&2
              exit 1
            fi
            sleep 30
          done
      - name: Publish release notes for the existing tag
        shell: bash
        run: |
          set -euo pipefail
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes_file" ]]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" --notes "$(cat "$notes_file")"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
